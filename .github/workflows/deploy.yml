name: 🚀 Deploy DetailingHouse a Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: ✅ Validar HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar que index.html existe
        run: |
          if [ ! -f index.html ]; then
            echo "❌ Error: index.html no encontrado"
            exit 1
          fi
          echo "✅ index.html encontrado ($(wc -c < index.html) bytes)"

      - name: Verificar imágenes
        run: |
          IMG_COUNT=$(ls assets/images/*.jpg 2>/dev/null | wc -l)
          echo "✅ ${IMG_COUNT} imágenes encontradas"

  deploy:
    name: 🌐 Deploy a Netlify
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy a Netlify (Producción)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --dir=. \
            --prod \
            --auth=$NETLIFY_AUTH_TOKEN \
            --site=$NETLIFY_SITE_ID

      - name: ✅ Deploy exitoso
        run: |
          echo "🎉 DetailingHouse desplegado exitosamente"
          echo "🌐 URL: https://detailinghouse.netlify.app"
