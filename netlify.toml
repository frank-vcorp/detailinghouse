# ============================================================
# DetailingHouse — Configuración Netlify
# ============================================================

[build]
  publish = "."
  command = "echo '✅ DetailingHouse build OK'"

# ─── Headers de seguridad ────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://detailinghouse-api-production.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ─── Cache para assets estáticos ─────────────────────────────
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── Redirects ────────────────────────────────────────────────
# Redirigir www a non-www
[[redirects]]
  from = "https://www.detailinghouse.netlify.app/*"
  to = "https://detailinghouse.netlify.app/:splat"
  status = 301
  force = true

# Página de error 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
